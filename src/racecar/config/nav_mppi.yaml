amcl:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: /scan
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    min_particles: 500
    max_particles: 2000
    max_beams: 60
    laser_model_type: "likelihood_field"
    laser_min_range: 0.1
    laser_max_range: 100.0
    laser_likelihood_max_dist: 2.0
    update_min_d: 0.025
    update_min_a: 0.06
    transform_tolerance: 0.3
    tf_broadcast: True
    set_initial_pose: True
    initial_pose.x: 0.0
    initial_pose.y: 0.0
    initial_pose.z: 0.0
    initial_pose.yaw: 0.0

amcl_map_client:
  ros__parameters:
    use_sim_time: False

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom_cartographer
    transform_tolerance: 0.1
    bt_loop_duration: 10
    default_server_timeout: 2000
    # 固定赛道只规划一次，不在行驶过程中重新规划，也不执行旋转或倒车恢复。
    default_nav_to_pose_bt_xml: "/home/bianbu/racecar/src/racecar/behavior_trees/navigate_to_pose_no_replanning.xml"
    default_nav_through_poses_bt_xml: "/home/bianbu/racecar/src/racecar/behavior_trees/navigate_through_poses_no_recovery.xml"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    odom_topic: /odom_cartographer
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 15.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # 距离目标点小于 0.6 米就认为到达；忽略终点朝向，防止阿克曼车绕圆。
      xy_goal_tolerance: 0.6
      yaw_goal_tolerance: 3.2
      stateful: False

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # 预测 40 个时间步，每步 0.05 秒，总预测时间为 2 秒。
      time_steps: 40
      model_dt: 0.05
      # RISC-V 车载计算机先使用 500 条采样轨迹，避免控制循环严重超时。
      batch_size: 500
      iteration_count: 1
      temperature: 0.3
      gamma: 0.015

      # 电调需要约 0.55 米/秒才能可靠起步，因此不让 MPPI 采样低速或倒车。
      vx_min: 0.55
      vx_max: 0.55
      vy_max: 0.0
      wz_max: 0.5
      vx_std: 0.1
      vy_std: 0.0
      wz_std: 0.3

      motion_model: "Ackermann"
      AckermannConstraints:
        # 最小转弯半径，单位：米；越大转弯越平缓。
        min_turning_r: 1.0

      transform_tolerance: 0.2
      prune_distance: 1.7
      retry_attempt_limit: 1
      regenerate_noises: False
      visualize: False

      # 不加载 GoalAngleCritic 和 TwirlingCritic，避免在终点追逐朝向或原地旋转。
      critics:
        - "ConstraintCritic"
        - "CostCritic"
        - "GoalCritic"
        - "PathAlignCritic"
        - "PathFollowCritic"
        - "PathAngleCritic"
        - "PreferForwardCritic"

      ConstraintCritic:
        enabled: True
        cost_power: 1
        cost_weight: 4.0

      CostCritic:
        enabled: True
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
        consider_footprint: True

      GoalCritic:
        enabled: True
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.8

      PathAlignCritic:
        enabled: True
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.8
        offset_from_furthest: 20
        use_path_orientations: False

      PathFollowCritic:
        enabled: True
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 0.8

      PathAngleCritic:
        enabled: True
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.8
        max_angle_to_furthest: 1.0
        forward_preference: True

      PreferForwardCritic:
        enabled: True
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.8

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: True
      width: 4
      height: 4
      resolution: 0.05
      footprint: "[[-0.32, -0.18], [-0.32, 0.18], [0.32, 0.18], [0.32, -0.18]]"
      plugins: ["voxel_layer", "inflation_layer"]

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: True
          marking: True
          obstacle_min_range: 0.1
          obstacle_max_range: 2.5
          raytrace_min_range: 0.0
          raytrace_max_range: 10.0
          max_obstacle_height: 2.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.25

      always_send_full_costmap: False

  local_costmap_client:
    ros__parameters:
      use_sim_time: False

  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: True
      footprint: "[[-0.32, -0.18], [-0.32, 0.18], [0.32, 0.18], [0.32, -0.18]]"
      # 全局路径只使用静态地图，避免雷达漂移触发重新规划。
      plugins: ["static_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0
        inflation_radius: 0.25

      always_send_full_costmap: True

  global_costmap_client:
    ros__parameters:
      use_sim_time: False

  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: False
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      # 全局路径规划使用 NavFn。
      plugin: "nav2_navfn_planner/NavfnPlanner"
      use_astar: False
      allow_unknown: False
      tolerance: 0.2

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: False
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    # 阿克曼底盘不允许原地旋转和倒车，只保留等待行为。
    behavior_plugins: ["wait"]
    wait:
      plugin: "nav2_behaviors/Wait"

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: True
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    odom_topic: /odom_cartographer
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    # 基本不限制 MPPI 输出，停车指令仍会立即传给底盘。
    max_velocity: [0.6, 0.0, 1.0]
    min_velocity: [0.0, 0.0, -1.0]
    max_accel: [20.0, 0.0, 20.0]
    max_decel: [-20.0, 0.0, -20.0]
